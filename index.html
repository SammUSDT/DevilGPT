<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#05060a;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
body::before{content:'';position:fixed;top:-20%;left:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(0,212,255,.06),transparent 70%);border-radius:50%;pointer-events:none;z-index:0}

.header{background:rgba(15,15,20,.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.04);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:10}
.header .left{display:flex;align-items:center;gap:12px}
.header .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#a855f7);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.header .info .name{font-size:15px;font-weight:700;color:#fff}
.header .info .status{font-size:11px;color:#4ade80;display:flex;align-items:center;gap:4px;margin-top:2px}
.header .info .status .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header .reset-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:#888;padding:8px 14px;border-radius:30px;font-size:11px;font-weight:600;cursor:pointer;transition:.2s;letter-spacing:1px}
.header .reset-btn:hover{color:#fff;border-color:rgba(0,212,255,.2)}

.chat-box{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.chat-box::-webkit-scrollbar{width:4px}
.chat-box::-webkit-scrollbar-thumb{background:rgba(0,212,255,.15);border-radius:10px}

.msg{display:flex;flex-direction:column;max-width:80%;animation:bubbleIn .3s ease}
@keyframes bubbleIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start;align-items:flex-start}

.msg .bubble{padding:12px 18px;border-radius:18px;font-size:14px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap}
.msg.user .bubble{background:linear-gradient(135deg,#00d4ff,#0088cc);color:#000;border-bottom-right-radius:6px;font-weight:500}
.msg.ai .bubble{background:rgba(255,255,255,.05);color:#e0e0e0;border-bottom-left-radius:6px;border:1px solid rgba(255,255,255,.04)}

.msg .meta{font-size:10px;color:#555;margin-top:4px;padding:0 4px;letter-spacing:.5px}

.typing{display:flex;align-items:center;gap:5px;padding:14px 18px;background:rgba(255,255,255,.05);border-radius:18px;border-bottom-left-radius:6px;width:fit-content;border:1px solid rgba(255,255,255,.04)}
.typing .dot{width:8px;height:8px;background:rgba(255,255,255,.3);border-radius:50%;animation:typing 1.4s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}
.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-6px);opacity:1}}

.input-area{background:rgba(15,15,20,.9);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.04);padding:14px 20px 20px;display:flex;gap:10px;position:relative;z-index:10}
.input-area input{flex:1;padding:14px 18px;border-radius:30px;border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.4);color:#fff;font-size:14px;outline:none;transition:.2s}
.input-area input:focus{border-color:rgba(0,212,255,.3);box-shadow:0 0 0 4px rgba(0,212,255,.05)}
.input-area input::placeholder{color:#444}
.input-area input:disabled{opacity:.5}
.input-area button{width:48px;height:48px;border-radius:50%;border:none;background:linear-gradient(135deg,#00d4ff,#0088cc);color:#000;font-size:20px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.input-area button:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(0,212,255,.3)}
.input-area button:active{transform:scale(.95)}
.input-area button:disabled{opacity:.5;cursor:not-allowed;transform:none}

.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(239,68,68,.95);color:#fff;padding:12px 24px;border-radius:60px;font-size:13px;font-weight:600;display:none;z-index:300;max-width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.show{display:block;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:#555;gap:12px}
.empty .icon{font-size:48px;opacity:.3}
.empty .text{font-size:14px;letter-spacing:1px}
.empty .sub{font-size:12px;color:#333}
</style>
</head>
<body>

<div class="header">
    <div class="left">
        <div class="avatar">🤖</div>
        <div class="info">
            <div class="name">BeachX AI</div>
            <div class="status"><span class="dot"></span> Online</div>
        </div>
    </div>
    <button class="reset-btn" onclick="resetChat()">↺ RESET</button>
</div>

<div class="chat-box" id="chatBox">
    <div class="empty" id="empty">
        <div class="icon">💬</div>
        <div class="text">Mulai ngobrol dengan AI</div>
        <div class="sub">Tanya apa aja, AI bakal jawab</div>
    </div>
</div>

<div class="input-area">
    <input type="text" id="input" placeholder="Ketik pesan..." autocomplete="off" onkeydown="if(event.key==='Enter') send()">
    <button id="btnSend" onclick="send()">➤</button>
</div>

<div class="toast" id="toast"></div>

<script>
const API_KEY = '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'
const API_URL = 'https://api.groq.com/openai/v1/chat/completions'
const MODEL = 'llama-3.3-70b-versatile'

let history = []
let isWaiting = false

function showToast(msg) {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.classList.add('show')
    setTimeout(() => el.classList.remove('show'), 3000)
}

function timeNow() {
    return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
}

function hideEmpty() {
    const empty = document.getElementById('empty')
    if (empty) empty.style.display = 'none'
}

function addMessage(role, text) {
    hideEmpty()
    const box = document.getElementById('chatBox')

    const msg = document.createElement('div')
    msg.className = 'msg ' + role

    const bubble = document.createElement('div')
    bubble.className = 'bubble'
    bubble.textContent = text

    const meta = document.createElement('div')
    meta.className = 'meta'
    meta.textContent = (role === 'user' ? 'Kamu' : 'AI') + ' • ' + timeNow()

    msg.appendChild(bubble)
    msg.appendChild(meta)
    box.appendChild(msg)
    box.scrollTop = box.scrollHeight
}

function showTyping() {
    hideEmpty()
    const box = document.getElementById('chatBox')
    const typing = document.createElement('div')
    typing.className = 'msg ai'
    typing.id = 'typingIndicator'
    typing.innerHTML = '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>'
    box.appendChild(typing)
    box.scrollTop = box.scrollHeight
}

function hideTyping() {
    const el = document.getElementById('typingIndicator')
    if (el) el.remove()
}

function setLoading(loading) {
    isWaiting = loading
    document.getElementById('input').disabled = loading
    document.getElementById('btnSend').disabled = loading
}

async function send() {
    const input = document.getElementById('input')
    const text = input.value.trim()
    if (!text || isWaiting) return

    addMessage('user', text)
    input.value = ''
    setLoading(true)
    showTyping()

    history.push({ role: 'user', content: text })

    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + API_KEY,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: MODEL,
                messages: [
                    {
                        role: 'system',
                        content: 'Kamu adalah BeachX AI, asisten yang ramah, santai, dan helpful. Jawab dengan bahasa Indonesia yang natural dan singkat. Jangan pakai markdown yang berlebihan.'
                    },
                    ...history
                ],
                temperature: 0.8,
                max_tokens: 1024
            })
        })

        const data = await res.json()
        hideTyping()

        if (!res.ok) {
            showToast('❌ ' + (data.error?.message || 'API error'))
            setLoading(false)
            return
        }

        const reply = data.choices?.[0]?.message?.content || 'Maaf, aku gak bisa jawab.'
        history.push({ role: 'assistant', content: reply })
        addMessage('ai', reply)

    } catch (e) {
        hideTyping()
        showToast('❌ Gagal konek: ' + e.message)
    }

    setLoading(false)
}

function resetChat() {
    if (!confirm('Reset percakapan?')) return
    history = []
    const box = document.getElementById('chatBox')
    box.innerHTML = `
        <div class="empty" id="empty">
            <div class="icon">💬</div>
            <div class="text">Mulai ngobrol dengan AI</div>
            <div class="sub">Tanya apa aja, AI bakal jawab</div>
        </div>
    `
}
</script>
</body>
</html>
